<!doctype html>
<meta charset="utf-8">
<title>pAIrtner duo</title>
<style>body{margin:0;display:flex;height:100vh;background:#000}iframe{flex:1;border:0;border-right:1px solid #333}</style>
<script>
fetch('/tokens.json').then(r=>r.json()).then(t=>{
  for(const [id,u] of Object.entries(t.users)){
    const f=document.createElement('iframe');
    f.src=`index.html?u=${id}&t=${u.token}&n=${u.name}&p=${t.ws_port}`;document.body.append(f)}})
</script>
