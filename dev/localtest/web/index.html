<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pAIrtner</title>
<style>
  body{margin:0;font:15px system-ui;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  header{padding:8px 12px;background:#1d1d1d;display:flex;justify-content:space-between}
  #log{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:85%;padding:8px 10px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:#2b5cff}.bot{align-self:flex-start;background:#2a2a2a}
  .relay{align-self:flex-start;background:#3a2a4a;border:1px solid #7a55a8}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .btns button{background:#444;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
  #typing{height:18px;padding-left:12px;color:#999;font-size:12px}
  form{display:flex;gap:6px;padding:8px;background:#1d1d1d}
  input{flex:1;padding:10px;border-radius:8px;border:0;background:#2a2a2a;color:#eee}
  form button{padding:0 16px;border:0;border-radius:8px;background:#2b5cff;color:#fff}
</style>
<header><b id="who">…</b><span id="st">connecting</span></header>
<div id="log"></div><div id="typing"></div>
<form id="f"><input id="i" autocomplete="off" placeholder="Message…"><button>Send</button></form>
<script>
const q=new URLSearchParams(location.search), uid=q.get('u'), tok=q.get('t'), port=q.get('p')||8765;
const log=document.getElementById('log'), typing=document.getElementById('typing');
document.getElementById('who').textContent=q.get('n')||('user '+uid);
const ws=new WebSocket(`ws://${location.hostname}:${port}`);
const add=(cls,text,btns)=>{const d=document.createElement('div');d.className='m '+cls;d.textContent=text;
  if(btns){const b=document.createElement('div');b.className='btns';
    btns.flat().forEach(x=>{const e=document.createElement('button');e.textContent=x.text;
      e.onclick=()=>{ws.send(JSON.stringify({type:'callback',user_id:uid,callback_data:x.callback_data}));b.remove()};b.append(e)});d.append(b)}
  log.append(d);log.scrollTop=log.scrollHeight};
ws.onopen=()=>ws.send(JSON.stringify({type:'auth',user_id:uid,token:tok}));
ws.onclose=()=>document.getElementById('st').textContent='disconnected';
ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==='auth_ok')document.getElementById('st').textContent='online';
  else if(m.type==='typing')typing.textContent=m.active?'typing…':'';
  else if(m.type==='reply'){typing.textContent='';add('bot',m.text,m.buttons);
    if(m.document)add('bot','📎 '+m.document.filename)}
  else if(m.type==='relay')add('relay',m.text);
  else if(m.type==='error')add('bot','⚠ '+m.text)};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('i');
  if(!i.value.trim())return;add('me',i.value);ws.send(JSON.stringify({type:'message',user_id:uid,text:i.value}));i.value=''};
</script>
