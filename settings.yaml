# pAIrtner Bot — tunables
# Secrets (API keys, tokens, encryption keys) belong in .env, NOT here.

# Bot personality file — loaded at startup as the system instruction base.
persona_file: persona.md

# Prompt directory structure.
prompts_dir: prompts
voices_dir: prompts/voices
default_voice: casual_en
default_voice_intensity: 0.5

# Message delivery cooldown in minutes.
# After a relay is approved, it waits this long before being sent.
cooldown_minutes: 15

# Daily cap for heavy (expensive) model calls per model.
heavy_daily_cap: 10

# How often the delivery loop checks for approved messages (seconds).
delivery_check_interval_seconds: 30

# Rate limiting — per-user thresholds.
rate_limit_per_minute: 10
rate_limit_per_day: 200

# If true, relay messages require explicit approval before delivery.
review_before_send: true

# LLM models — override via MODEL_DEFAULT / MODEL_HEAVY env vars.
models:
  default: "gemini-3.1-flash-lite"
  heavy:
    - "gemini-3-flash-preview"
    - "gemini-3.8-flash"

# Cooldown behavior when multiple messages are approved within the window.
#   "accumulate" — messages queue up and each keeps its own timer.
#   "reset"      — timer resets on each new approval (future).
cooldown:
  behavior: "accumulate"

# Fact categories — LLM classifies facts into one of these.
fact_categories:
  - relationship
  - household
  - emotional
  - work
  - health
  - other

# Automated daily backup of the SQLite database.
backup:
  enabled: true
  directory: backups
  daily_count: 7
  weekly_count: 4

# Daily digest — evening summary sent to both partners.
digest:
  enabled: true
  time: "20:00"
  timezone: "Asia/Kolkata"

# Weekly check-in — reflection questions for both partners.
checkin:
  enabled: true
  day: "sunday"
  time: "18:00"
  timezone: "Asia/Kolkata"
  questions:
    - "What went well this week?"
    - "What could we do differently?"
    - "What are you grateful for about us?"

# Mood system — per-user emotional state with auto-expiry.
mood:
  default_expiry_hours: 2
  styles:
    stressed: {dampening_override: 0.9, response_length: short}
    happy: {dampening_override: 0.3, response_length: normal}
    angry: {dampening_override: 0.95, response_length: short}
    reflective: {dampening_override: 0.5, response_length: long}

# Logarithmic dampening — softens LLM output intensity.
dampening:
  enabled: true
  default_base: 0.7
  max_intensity: 10.0
  blunt_bypass: true

# Articulation teaching (placeholder for FEAT-003).
articulation:
  enabled: true

# Proactive nudges — context-aware conversation starters.
nudges:
  enabled: true
  interval_hours: 24
  quiet_start: "09:00"
  quiet_end: "21:00"

# /mediate — neutral perspective from shared facts and filtered partner impressions.
mediate:
  default_days: 7
  max_days: 90
  include_perceptions: true
  min_confidence: 0.4
  max_themes_per_side: 8

# Appreciation ratio tracking (Gottman 5:1).
appreciation:
  enabled: true
  target_ratio: 5.0
  check_days: 7

# Horsemen detection — communication anti-patterns.
horsemen:
  enabled: true

# Conflict resolution tracking — automatic detection and resolution.
conflicts:
  enabled: true
  auto_detect: true
  resolution_timeout_hours: 48

# Relay feedback loop — ask sender how the relay landed.
feedback:
  enabled: true
  timeout_hours: 24

# A/B rewrite — show two dampening variants for relays in mid-range.
ab_rewrite:
  enabled: true
  dampening_range: [0.3, 0.7]

# Relationship timeline — event logging and display.
timeline:
  enabled: true
  max_events: 500

# Soft read receipts — relay acknowledgment tracking.
read_receipts:
  enabled: true

# Therapy export — structured therapy-ready reports.
therapy_export:
  enabled: true

# FTS5 full-text search — threshold for switching to smart context.
search:
  fts_threshold: 100

# Smart context window — controls how facts are pulled for prompts.
context:
  recent_days: 7
  max_relevant_facts: 20

# Voice auto-adaptation — learned voice profile from user writing style.
voice:
  auto_learn: true
  learn_after_messages: 10

# Adapter architecture — which transport to start by default.
# telegram | websocket | cli | both | rest | telegram+rest
adapter: telegram
ws_port: 8080

# REST adapter (JSON over HTTP; also serves the PWA from couples_bot/web).
# registration: closed | invite | open. With "invite" the secret comes from the
# REST_INVITE_CODE environment variable (never stored here). "open" is for a
# trusted loopback/LAN only. Env overrides: REST_HOST, REST_PORT,
# REST_REGISTRATION, REST_MAX_TEXT_CHARS, REST_EVENT_RETENTION_DAYS,
# REST_LONG_POLL_MAX_SECONDS.
rest:
  host: 127.0.0.1
  port: 8780
  registration: invite
  max_text_chars: 4000
  event_retention_days: 14
  long_poll_max_seconds: 25

# Background loop intervals in seconds (defaults match the old fixed values).
# nudge_interval_seconds 0 = use nudges.interval_hours * 3600.
# Env overrides: LOOPS_DIGEST_POLL_SECONDS, LOOPS_CHECKIN_POLL_SECONDS,
# LOOPS_NUDGE_INTERVAL_SECONDS, LOOPS_BACKUP_INTERVAL_SECONDS.
loops:
  digest_poll_seconds: 60
  checkin_poll_seconds: 60
  nudge_interval_seconds: 0
  backup_interval_seconds: 3600
# Admin dashboard — standalone web UI (python -m couples_bot.dashboard).
# The access token is NOT here: set DASHBOARD_TOKEN in the environment.
# Every key can be overridden by DASHBOARD_HOST / _PORT / _SHOW_RAW_TEXT /
# _ADMIN_ACTIONS / _PAGE_SIZE / _SESSION_TTL_HOURS.
dashboard:
  host: "127.0.0.1"          # bind address; use a LAN / Tailscale IP, never public
  port: 8765
  show_raw_text: true        # false = counts and metadata only, no message/fact text
  admin_actions_enabled: true  # false = backup/clear actions return 403
  page_size: 50              # explorer rows per page (max 200)
  session_ttl_hours: 12
