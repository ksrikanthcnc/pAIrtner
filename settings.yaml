# pAIrtner Bot — tunables
# Secrets (API keys, tokens, encryption keys) belong in .env, NOT here.

# Bot personality file — loaded at startup as the system instruction base.
persona_file: persona.md

# Prompt directory structure.
prompts_dir: prompts
voices_dir: prompts/voices
default_voice: casual_en
default_voice_intensity: 0.5

# Message delivery cooldown in minutes.
# After a relay is approved, it waits this long before being sent.
cooldown_minutes: 15

# Daily cap for heavy (expensive) model calls per model.
heavy_daily_cap: 10

# How often the delivery loop checks for approved messages (seconds).
delivery_check_interval_seconds: 30

# Rate limiting — per-user thresholds.
rate_limit_per_minute: 10
rate_limit_per_day: 200

# If true, relay messages require explicit approval before delivery.
review_before_send: true

# LLM models — override via MODEL_DEFAULT / MODEL_HEAVY env vars.
models:
  default: "gemini-3.1-flash-lite"
  heavy:
    - "gemini-3-flash-preview"
    - "gemini-3.8-flash"

# Cooldown behavior when multiple messages are approved within the window.
#   "accumulate" — messages queue up and each keeps its own timer.
#   "reset"      — timer resets on each new approval (future).
cooldown:
  behavior: "accumulate"

# Fact categories — LLM classifies facts into one of these.
fact_categories:
  - relationship
  - household
  - emotional
  - work
  - health
  - other

# Automated daily backup of the SQLite database.
backup:
  enabled: true
  directory: backups
  daily_count: 7
  weekly_count: 4

# Daily digest — evening summary sent to both partners.
digest:
  enabled: true
  time: "20:00"
  timezone: "Asia/Kolkata"

# Weekly check-in — reflection questions for both partners.
checkin:
  enabled: true
  day: "sunday"
  time: "18:00"
  timezone: "Asia/Kolkata"
  questions:
    - "What went well this week?"
    - "What could we do differently?"
    - "What are you grateful for about us?"
