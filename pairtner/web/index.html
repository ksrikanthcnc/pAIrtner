<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>pAIrtner</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="auth" class="screen" hidden>
  <h1>pAIrtner</h1>
  <p id="privacy" class="notice"></p>
  <p id="auth-error" class="error" role="alert" hidden></p>
  <form id="signup">
    <label><span data-i18n="name">Name</span>
      <input id="name" maxlength="40" autocomplete="nickname" required></label>
    <label><span data-i18n="password">Password</span>
      <input id="password" type="password" autocomplete="current-password" required></label>
    <label><span data-i18n="language">Language</span>
      <select id="lang"></select></label>
    <button type="submit" class="primary" data-i18n="signup">Log in</button>
  </form>
</main>
<div id="app" class="app" hidden>
  <header id="app-header" class="app-header">
    <b id="who"></b>
    <span id="admin-badge" class="badge" hidden>Admin</span>
    <span id="status" class="status"></span>
    <button id="menu-btn" type="button" aria-label="menu">&#8942;</button>
  </header>
  <div id="menu" class="menu" hidden>
    <button id="rotate" type="button" data-i18n="rotate">Rotate token</button>
    <button id="signout" type="button" data-i18n="signout">Sign out</button>
  </div>
  <div id="views" class="views"></div>
  <nav id="bottom-nav" class="bottom-nav" aria-label="main">
    <a href="#chat" data-tab="chat"><span class="ico">&#128172;</span><span data-i18n="nav_chat">Chat</span></a>
    <a href="#dashboard" data-tab="dashboard"><span class="ico">&#128202;</span><span data-i18n="nav_data">My Data</span></a>
    <a href="#memory" data-tab="memory"><span class="ico">&#129504;</span><span data-i18n="nav_memory">Memory</span></a>
    <a href="#settings" data-tab="settings"><span class="ico">&#9881;&#65039;</span><span data-i18n="nav_settings">Settings</span></a>
    <a href="#dashboard/admin" data-tab="admin" id="nav-admin" hidden><span class="ico">&#128737;&#65039;</span><span data-i18n="nav_admin">Admin</span></a>
  </nav>
</div>
<script src="/render.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
