# pAIrtner Couples Bot - Docker Compose
#
#   cp .env.example .env     # fill in TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, DASHBOARD_TOKEN
#   docker compose up -d
#   docker compose logs -f
#
# Both services share the named volume `pairtner-data` (SQLite DB at /data/pairtner.db).
# Backups are written to ./backups on the host.

x-common: &common
  build: .
  restart: unless-stopped
  volumes:
    - pairtner-data:/data
    - ./settings.yaml:/app/settings.yaml:ro
    - ./backups:/app/backups

services:
  pairtner-bot:
    <<: *common
    env_file: .env
    environment:
      DB_PATH: /data/pairtner.db
      ADAPTER: telegram+rest
      REST_HOST: 0.0.0.0
      REST_PORT: "8080"
    ports:
      - "${REST_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - pairtner-data:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./packs:/app/packs:ro
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Admin dashboard: separate process, same DB, no bot secrets (only DASHBOARD_TOKEN).
  pairtner-dashboard:
    <<: *common
    command: ["python", "-m", "pairtner.dashboard"]
    environment:
      DB_PATH: /data/pairtner.db
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8765"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8765:8765"
    depends_on:
      - pairtner-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pairtner-data:
