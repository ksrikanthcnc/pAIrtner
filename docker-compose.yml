# pAIrtner Couples Bot - Docker Compose
#
# Standalone: cp .env.example .env && docker compose up -d
# Stack-included: the parent compose includes this file; state mounts from PAIRTNER_DATA.
#
# Ports default to 8180 (REST) and 8765 (dashboard). Override in .env.

x-common: &common
  build: .
  restart: unless-stopped
  stop_grace_period: 30s

services:
  pairtner-bot:
    <<: *common
    container_name: pairtner
    env_file: .env
    environment:
      DB_PATH: /data/pairtner.db
      ADAPTER: telegram+rest
      REST_HOST: 0.0.0.0
      REST_PORT: "${REST_PORT:-8180}"
    ports:
      - "${REST_BIND:-127.0.0.1}:${REST_PORT:-8180}:${REST_PORT:-8180}"
    volumes:
      - ${PAIRTNER_DATA:-./data}:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./packs:/app/packs:ro
      - ${PAIRTNER_DATA:-./data}/backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('REST_PORT','8180'), timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # wAIldo — solo personal journal bot (same engine, separate DB + Telegram token)
  waildo-bot:
    <<: *common
    container_name: waildo
    env_file: .env.waildo
    environment:
      DB_PATH: /data/waildo.db
      SOLO_MODE: "true"
      ADAPTER: telegram+rest
      REST_HOST: 0.0.0.0
      REST_PORT: "${WAILDO_REST_PORT:-8181}"
    ports:
      - "${WAILDO_REST_BIND:-127.0.0.1}:${WAILDO_REST_PORT:-8181}:${WAILDO_REST_PORT:-8181}"
    volumes:
      - ${WAILDO_DATA:-./data/waildo}:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./packs:/app/packs:ro
      - ${WAILDO_DATA:-./data/waildo}/backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('REST_PORT','8181'), timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
