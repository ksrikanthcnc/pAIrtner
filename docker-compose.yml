# pAIrtner Couples Bot — Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in TELEGRAM_BOT_TOKEN + GEMINI_API_KEY
#   docker compose up -d
#   docker compose logs -f
#
# The SQLite database is persisted via volume mount.
# Settings and the prompt pack (./packs) are mounted read-only.
# Backups are written to ./backups/ on the host.
#
# For WebSocket adapter, uncomment the ports and ADAPTER lines below.
# For the web app / REST API, see the commented REST lines below
# (docs/REST_API.md, DEPLOYMENT.md "Web app (PWA) / REST API").
# For Ollama on the host, uncomment extra_hosts.

services:
  pairtner:
    build: .
    env_file: .env
    volumes:
      - ./couples_bot.db:/app/couples_bot.db
      - ./settings.yaml:/app/settings.yaml:ro
      - ./packs:/app/packs:ro   # prompt pack: edit on the host, changes apply on the next message
      - ./backups:/app/backups
    restart: unless-stopped
    # Uncomment for WebSocket adapter:
    # ports:
    #   - "8080:8080"
    # environment:
    #   - ADAPTER=both
    # Uncomment for the web app / REST API instead (publish on a private interface;
    # REST_INVITE_CODE is read from .env via env_file, never write it here):
    # ports:
    #   - "127.0.0.1:8780:8780"
    # environment:
    #   - ADAPTER=telegram+rest      # or: rest
    #   - REST_HOST=0.0.0.0
    #   - REST_REGISTRATION=invite
    # Uncomment for Ollama on the host (Linux):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Admin dashboard: separate process, shares the DB file, no bot secrets.
  # Opt-in:  docker compose --profile dashboard up -d dashboard
  # Needs DASHBOARD_TOKEN (16+ chars) in .env or the shell; compose
  # interpolates just that value, so the bot's other secrets stay out of this
  # container. DASHBOARD_BIND is the host-side interface (LAN / Tailscale IP);
  # keep it off the public internet. See DEPLOYMENT.md.
  dashboard:
    profiles: ["dashboard"]
    build: .
    entrypoint: ["uv", "run", "--no-dev", "python", "-m", "couples_bot.dashboard"]
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8765"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8765:8765"
    volumes:
      - ./couples_bot.db:/app/couples_bot.db
      - ./settings.yaml:/app/settings.yaml:ro
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
