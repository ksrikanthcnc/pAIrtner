# pAIrtner Couples Bot - Docker Compose
#
# Standalone: cp .env.example .env && docker compose up -d
# Stack-included: the parent compose includes this file; state mounts from PAIRTNER_DATA.
#
# Ports default to 8180 (REST) and 8765 (dashboard). Override in .env.

x-common: &common
  build: .
  restart: unless-stopped
  stop_grace_period: 30s

services:
  pairtner-bot:
    <<: *common
    container_name: pairtner
    env_file: .env
    environment:
      DB_PATH: /data/pairtner.db
      ADAPTER: telegram+rest
      REST_HOST: 0.0.0.0
      REST_PORT: "${REST_PORT:-8180}"
    ports:
      - "${REST_BIND:-127.0.0.1}:${REST_PORT:-8180}:${REST_PORT:-8180}"
    volumes:
      - ${PAIRTNER_DATA:-./data}:/data
      - ./settings.yaml:/app/settings.yaml:ro
      - ./packs:/app/packs:ro
      - ${PAIRTNER_DATA:-./data}/backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('REST_PORT','8180'), timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pairtner-dashboard:
    <<: *common
    container_name: pairtner-dashboard
    command: ["python", "-m", "pairtner.dashboard"]
    env_file: .env
    environment:
      DB_PATH: /data/pairtner.db
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "${DASHBOARD_PORT:-8765}"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8765}:${DASHBOARD_PORT:-8765}"
    volumes:
      - ${PAIRTNER_DATA:-./data}:/data
    depends_on:
      - pairtner-bot
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('DASHBOARD_PORT','8765'), timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
