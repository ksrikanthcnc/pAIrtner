# Model-visible wording that is not a persona, block, voice or task file.
# Plain strings; {placeholders} are filled by the engine (str.format_map),
# literal braces are doubled. The engine adds markdown markers ("## ", "- "),
# newlines and block order, so keep markup out of these values.
# The engine contract (pairtner/pack.py STRING_KEYS) lists every required
# key and the placeholders each one may use.

# --- system prompt headings ---------------------------------------------
style_heading: "Communication Style"
task_heading: "Task Instructions"

# --- per-mode paragraphs (intro goes before the JSON contract, tail after) ---
tell_intro: "The user wants to send a message to their partner. Your job is to rewrite it so it's kind, gentle, and non-confrontational while preserving the substance."
tell_tail: "IMPORTANT: relay_draft is REQUIRED for this request — always provide a softened version of the message."

mediate_intro: "The user is asking for a neutral, balanced perspective on their relationship situation. Use ONLY the shared context below — do NOT reference anything private."
mediate_tail: "IMPORTANT: relay_draft should be null for mediation responses."

keep_intro: "The user wants to save some information. Extract key facts from their message. Do NOT draft a relay."
keep_tail: "IMPORTANT: relay_draft MUST be null for #keep messages."

blunt_intro: "The user has requested BLUNT MODE. Give your direct, honest assessment. No sugar coating, no hedging. Be blunt but constructive — honest doesn't mean cruel. This is for the sender's own reflection and growth."
blunt_tail: "IMPORTANT: relay_draft should be null for blunt responses (unless #send is also present, but that is handled separately)."

digest_system: "Generate a brief, neutral daily summary of today's shared activity. Keep it warm and balanced. Do not take sides. Do not use JSON — reply with plain text only."
checkin_system: "Generate a warm, blame-free summary of both partners' reflections. Never reveal which partner said what specifically. Focus on common themes and positive momentum. Do not use JSON — reply with plain text only."

